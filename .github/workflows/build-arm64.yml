name: Build ARM64 Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'Dockerfile.deps'
      - 'docker/**'
      - '.github/workflows/build-arm64.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.deps'
      - 'docker/**'
      - '.github/workflows/build-arm64.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-ragflow-arm64:
    name: Build RagFlow ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for RagFlow
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=arm64-latest
            type=raw,value=arm64-{{date 'YYYYMMDD-HHmmss'}}
            type=sha,prefix=arm64-
            type=ref,event=branch,prefix=arm64-
            type=ref,event=pr,prefix=arm64-pr-

      - name: Build and push RagFlow ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.arm64
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ragflow-arm64
          cache-to: type=gha,mode=max,scope=ragflow-arm64
          build-args: |
            NEED_MIRROR=0

  build-sandbox-images-arm64:
    name: Build Sandbox Images ARM64
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sandbox-base-python
            dockerfile: ./sandbox/sandbox_base_image/python/Dockerfile
            context: ./sandbox/sandbox_base_image/python
          - name: sandbox-base-nodejs
            dockerfile: ./sandbox/sandbox_base_image/nodejs/Dockerfile
            context: ./sandbox/sandbox_base_image/nodejs
          - name: sandbox-executor-manager
            dockerfile: ./sandbox/executor_manager/Dockerfile
            context: ./sandbox/executor_manager
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.name }}
          tags: |
            type=raw,value=arm64-latest
            type=sha,prefix=arm64-

      - name: Build and push ${{ matrix.name }} ARM64
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64

  verify-arm64-images:
    name: Verify ARM64 Images
    runs-on: ubuntu-latest
    needs: [build-ragflow-arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ARM64 RagFlow image
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-latest"
          echo "Pulling image: ${IMAGE_TAG}"
          docker pull --platform linux/arm64 ${IMAGE_TAG}

      - name: Inspect ARM64 image
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-latest"
          echo "=== Inspecting image: ${IMAGE_TAG} ==="
          docker inspect ${IMAGE_TAG}
          echo ""
          echo "=== Architecture verification ==="
          ARCH=$(docker inspect ${IMAGE_TAG} | jq -r '.[0].Architecture')
          echo "Image Architecture: ${ARCH}"
          if [ "${ARCH}" != "arm64" ]; then
            echo "ERROR: Expected arm64 architecture but got ${ARCH}"
            exit 1
          fi
          echo "✓ Successfully verified ARM64 architecture"

      - name: Prepare docker-compose environment
        run: |
          cd docker
          cp .env .env.backup || true
          
          # Update .env to use ARM64 image
          sed -i "s|RAGFLOW_IMAGE=.*|RAGFLOW_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-latest|g" .env
          
          echo "Updated .env file:"
          grep RAGFLOW_IMAGE .env

      - name: Start services with docker-compose
        run: |
          cd docker
          echo "Starting docker-compose services..."
          docker-compose --profile cpu up -d mysql redis minio
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          sleep 30
          
          # Check service status
          docker-compose ps

      - name: Verify RagFlow container architecture
        run: |
          cd docker
          # Start ragflow service
          docker-compose --profile cpu up -d ragflow-cpu
          
          # Wait for container to start
          sleep 10
          
          # Get container ID
          CONTAINER_ID=$(docker-compose ps -q ragflow-cpu)
          echo "RagFlow container ID: ${CONTAINER_ID}"
          
          if [ -n "${CONTAINER_ID}" ]; then
            echo "=== Container inspection ==="
            docker inspect ${CONTAINER_ID} | jq '.[0].Config.Image, .[0].Platform'
            
            # Verify architecture inside container
            echo "=== Verifying architecture inside container ==="
            docker exec ${CONTAINER_ID} uname -m || echo "Container not ready yet"
            
            # Check if container is running
            STATUS=$(docker inspect ${CONTAINER_ID} | jq -r '.[0].State.Status')
            echo "Container status: ${STATUS}"
          else
            echo "WARNING: RagFlow container not started"
          fi

      - name: Check logs
        if: always()
        run: |
          cd docker
          echo "=== RagFlow logs ==="
          docker-compose logs ragflow-cpu || true
          echo "=== MySQL logs ==="
          docker-compose logs mysql | tail -50 || true

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker-compose --profile cpu down -v || true

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-ragflow-arm64, build-sandbox-images-arm64, verify-arm64-images]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## ARM64 Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox-base-python:arm64-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox-base-nodejs:arm64-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox-executor-manager:arm64-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull --platform linux/arm64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
